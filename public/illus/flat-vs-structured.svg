  </g>
  <!-- 右：成册的书 -->
  <g transform="translate(500,58)">
    <rect x="30" y="0" width="120" height="160" rx="4 10 10 4" fill="#f2e8d9" stroke="#a88438" stroke-width="2"/>
    <rect x="42" y="12" width="100" height="136" rx="3" fill="none" stroke="#c9b98e" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="38" y1="14" x2="38" y2="146" stroke="#a88438" stroke-width="2.5"/>
    <circle cx="92" cy="52" r="9" fill="none" stroke="#a88438" stroke-width="2"/>
    <circle cx="68" cy="80" r="6" fill="#a88438"/>
    <circle cx="112" cy="86" r="6" fill="#a88438"/>
    <line x1="75" y1="60" x2="90" y2="74" stroke="#a88438" stroke-width="1.5"/>
    <line x1="97" y1="62" x2="112" y2="82" stroke="#a88438" stroke-width="1.5"/>
    <line x1="72" y1="83" x2="108" y2="86" stroke="#c9b98e" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="92" y="128" font-size="12" fill="#6e685f" text-anchor="middle">目录 · 索引 · 关联</text>
    <text x="90" y="188" font-size="14" fill="#6e685f" text-anchor="middle">整理成册，有目录有字典</text>
