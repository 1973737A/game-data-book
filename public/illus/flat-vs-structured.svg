<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="820" height="250" fill="#fffdf9" rx="14"/>
  <text x="410" y="38" font-size="18" font-weight="700" fill="#262421" text-anchor="middle">平铺入库 vs 结构化组织</text>
  <!-- 左：散落纸页 -->
  <g transform="translate(30,60)">
    <rect x="20" y="10" width="90" height="60" rx="4" fill="#f7f2e6" stroke="#d8d0c1" transform="rotate(-9 65 40)"/>
    <rect x="120" y="0" width="90" height="60" rx="4" fill="#f7f2e6" stroke="#d8d0c1" transform="rotate(7 165 30)"/>
    <rect x="60" y="70" width="90" height="60" rx="4" fill="#f7f2e6" stroke="#d8d0c1" transform="rotate(-4 105 100)"/>
    <rect x="180" y="62" width="90" height="60" rx="4" fill="#f7f2e6" stroke="#d8d0c1" transform="rotate(11 225 92)"/>
    <rect x="30" y="132" width="90" height="60" rx="4" fill="#f7f2e6" stroke="#d8d0c1" transform="rotate(5 75 162)"/>
    <rect x="150" y="128" width="90" height="60" rx="4" fill="#f7f2e6" stroke="#d8d0c1" transform="rotate(-8 195 158)"/>
